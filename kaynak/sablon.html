:root{

*{box-sizing:border-box}

.kt-sec.ir{grid-template-columns:1fr 1fr}

<script>
(function(){
  /* Sûre adları (Türkçe, Arapça) ve âyet sayıları */
  var S = /*SURELER*/;
  var MEAL = [{k:'d', ad:'Diyanet İşleri', ks:'Diyanet'}, {k:'v', ad:'Diyanet Vakfı (TDV)', ks:'TDV'}, {k:'e', ad:'Elmalılı Hamdi Yazır', ks:'Elmalılı'}];
  var BESMELE = 'بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ';
  var app = document.getElementById('app'), cache = {};

  function rd(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function arNo(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
  function sade(s){return String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ'’ʿ`\-\s]/g,'').replace(/ı/g,'i')}

  /* Seçili mealler ve yazı boyu */
  var secili = rd('ml_secim', ['d','v','e']);
  var boy = rd('ml_boy', 1.75);
  function boyUygula(){ boy=Math.max(1.25,Math.min(2.75,Math.round(boy*100)/100)); document.documentElement.style.setProperty('--ar-size', boy+'rem'); wr('ml_boy', boy); }
  boyUygula();
  document.getElementById('kucult').onclick=function(){ boy-=.125; boyUygula(); };
  document.getElementById('buyut').onclick=function(){ boy+=.125; boyUygula(); };

  function veri(s){
    if(cache[s]) return Promise.resolve(cache[s]);
    return fetch('veri/'+('00'+s).slice(-3)+'.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(o){ cache[s]=o; return o; });
  }

  /* Adres düzeni: #/ liste · #/2 sûre okuma · #/2/255 âyet */
  function yol(){ if(/^#\/test/.test(location.hash||'')) return {test:1}; if(/^#\/irab/.test(location.hash||'')) return {irab:1}; if(/^#\/belagat/.test(location.hash||'')) return {bel:1}; var m=(location.hash||'').match(/^#\/(\d+)(?:\/(\d+))?/); if(!m) return {}; var s=+m[1]; if(s<1||s>114) return {}; var a=m[2]?+m[2]:0; if(a>S[s-1][2]) a=S[s-1][2]; return {s:s,a:a}; }
  function git(h, degistir){ try{ if(degistir) history.replaceState(history.state,'',h); else history.pushState(null,'',h); }catch(e){ location.hash=h; return; } ciz(); }
  window.mlBasa = function(){ if(location.hash && location.hash!=='#/') git('#/'); else scrollTo({top:0,behavior:'smooth'}); };
  document.getElementById('brand').onclick = window.mlBasa;
  addEventListener('popstate', ciz);
  addEventListener('hashchange', ciz);

  /* ================= İ'RÂB TESTİ =================
     Sorular veri/irab.json (kaynak/irab.txt): görevler el-Cedvel ve Derviş'le karşılaştırılarak yazıldı, açıklamalar bizim. Kayıt ml_ir: {n,d,y,b:{doğru çözülen soru anahtarları}} */
  /* Cüz başları (sûre, âyet) — i'râb ve belâgat testlerinde kapsam cüz cüz */
  var CUZB=[[1,1],[2,142],[2,253],[3,93],[4,24],[4,148],[5,82],[6,111],[7,88],[8,41],[9,93],[11,6],[12,53],[15,1],[17,1],[18,75],[21,1],[23,1],[25,21],[27,56],[29,46],[33,31],[36,28],[39,32],[41,47],[46,1],[51,31],[58,1],[67,1],[78,1]];
  function cuzNo(s,a){ for(var i=CUZB.length-1;i>0;i--){ var b=CUZB[i]; if(s>b[0]||(s===b[0]&&a>=b[1])) return i+1; } return 1; }
  function cuzlar(L){ var c=[]; L.forEach(function(x){ var n=cuzNo(x.s,x.a); if(c.indexOf(n)<0) c.push(n); }); return c.sort(function(p,q){ return p-q; }); }
  function cuzSuz(L,k){ return k==='hepsi'?L:L.filter(function(x){ return 'c'+cuzNo(x.s,x.a)===k; }); }
  var IR=null, IT=null;
  var TERIM={isim:['مبتدأ','خبر','فاعل','مفعول به','مفعول به ثان','مضاف إليه','نعت','بدل','معطوف','جار ومجرور','نائب فاعل','حال','تمييز','اسم إنّ','خبر إنّ','اسم كان','خبر كان','اسم لا','مفعول لأجله','مفعول مطلق','ظرف','منادى','مستثنى','توكيد'], fiil:['فعل ماض','فعل مضارع','فعل أمر','اسم فعل']};
  function karisT(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), x=a[i]; a[i]=a[j]; a[j]=x; } return a; }

  }
  /* Kapsam (ml_ir.kap): 'hepsi' ya da sûre no. Bir tur 20 soru: önce hiç doğru çözülmemiş sorular, sonra seviyeye göre (kolaydan zora) */
  function irKap(){ var r=rd('ml_ir',null)||{}, k=r.kap||'hepsi'; return (k==='hepsi'||cuzlar(IR).indexOf(+k.slice(1))>=0&&k[0]==='c')?k:'hepsi'; }
  function irHavuz(k){ return cuzSuz(IR,k); }
  function irKapHtml(){ var k=irKap(), C=cuzlar(IR); if(C.length<2) return ''; return '<div class="kt-kap"><span class="lb">Kapsam:</span>'+[['hepsi','Hepsi']].concat(C.map(function(n){ return ['c'+n, n+'. cüz']; })).map(function(a){ return '<button type="button" class="chip'+(k===a[0]?' on':'')+'" data-irk="'+a[0]+'">'+esc(a[1])+' <small style="opacity:.6">'+irHavuz(a[0]).length+'</small></button>'; }).join('')+'</div>'; }
  function irKapBagla(){ app.querySelectorAll('[data-irk]').forEach(function(b){ b.onclick=function(){ var r=rd('ml_ir',null)||{n:0,d:0,y:0}; r.kap=b.dataset.irk; wr('ml_ir',r); irCiz(); }; }); }
  function irBas(){
    var r=rd('ml_ir',null)||{}, B=r.b||{}, H=karisT(irHavuz(irKap()).slice());
    H.sort(function(a,b){ var ka=B[a.s+'-'+a.a+'-'+a.n]?1:0, kb=B[b.s+'-'+b.a+'-'+b.n]?1:0; return ka-kb; });
    var sira=H.slice(0,20).sort(function(a,b){ return a.lv-b.lv; });
    IT={mod:'soru', sira:sira, i:0, d:0, y:0, cevap:null, v:IT.v||{}};
    irGoster();
  }
  function irGoster(){ var x=IT.sira[IT.i]; if(!IT.v[x.s]){ app.innerHTML='<p class="yuk">Yükleniyor…</p>'; veri(x.s).then(function(o){ IT.v[x.s]=o; irGoster(); }).catch(function(){ app.innerHTML='<p class="bos">Metin yüklenemedi.</p>'; }); return; } irSoru(); irCiz(); }
  function irSoru(){ var x=IT.sira[IT.i]; var dis=TERIM[x.tur].filter(function(t){ return t!==x.t && (x.h||[]).indexOf(t)<0; }); IT.sec=karisT([x.t].concat(karisT(dis).slice(0,3))); IT.cevap=null; }
  function irAyet(x){ var t=IT.v[x.s].a[x.a-1], n=0; return t.split(' ').map(function(w){ if(isaret(w)) return esc(w); var c=(n++===x.n)?' class="irk"':''; return '<span'+c+'>'+esc(w)+'</span>'; }).join(' ')+' <span class="ayno">﴿'+arNo(x.a)+'﴾</span>'; }
  function irCiz(){
    var h='<h1>İ\'râb testi</h1><p class="sub">Âyetteki <b style="color:#c0392b">kırmızı kelimenin</b> i\'râbını seçin. Her tur 20 soru; önce çözmediğiniz sorular gelir, kolaydan zora gider.</p>';

      h+='<div class="card kt-soru" style="text-align:center"><p style="font-size:1.1rem;margin:0 0 4px"><b>Tur bitti</b></p><p style="margin:0;color:var(--muted)">'+IT.d+' doğru · '+IT.y+' yanlış · %'+Math.round(IT.d/top*100)+'</p><div class="kt-btn"><button type="button" id="irBas">Yeniden başla</button><button type="button" class="ik" onclick="location.hash=\'#/\'">Sûre listesi</button></div></div>'+irKapHtml();
      app.innerHTML=h+kunye(); document.getElementById('irBas').onclick=irBas; irKapBagla(); return;

    h+='<div class="card kt-soru"><div class="kt-tip"><span>'+esc(S[x.s-1][0])+' '+x.a+'</span><span>Soru '+(IT.i+1)+'/'+IT.sira.length+' · '+['','temel','orta','zor'][x.lv]+'</span></div>';
    h+='<div class="ir-ayt">'+irAyet(x)+'</div><p class="ir-sor"><span class="arw">'+esc(x.w)+'</span> kelimesinin i\'râbı nedir?</p>';
    h+='<div class="kt-sec ir">'+IT.sec.map(function(t,i){ var c=''; if(IT.cevap!=null){ if(t===x.t) c='dg'; else if(i===IT.cevap) c='yn'; } return '<button type="button" class="'+c+'" data-i="'+i+'"'+(IT.cevap!=null?' disabled':'')+'>'+esc(t)+'</button>'; }).join('')+'</div>';
    if(IT.cevap!=null){
      var ok=IT.sec[IT.cevap]===x.t;
      h+='<div class="kt-son ir-son">'+(ok?'<b style="color:#1f5a45">Doğru!</b> ':'<b style="color:#a8432f">Yanlış.</b> ')+'<span class="arw">'+esc(x.w)+'</span> : <b style="font-family:var(--ar);font-size:1.2rem">'+esc(x.t)+'</b><p class="ac">'+esc(x.x)+'</p><div class="lk"><a href="https://tafsir.app/aljadwal/'+x.s+'/'+x.a+'" target="_blank" rel="noopener">el-Cedvel ↗</a><a href="https://tafsir.app/iraab-aldarweesh/'+x.s+'/'+x.a+'" target="_blank" rel="noopener">Derviş ↗</a>'+bldButton('i:'+x.s+'-'+x.a+'-'+x.n, "İ'râb testi · "+S[x.s-1][0]+' '+x.a, x.w+' = '+x.t)+'</div></div><div class="kt-btn"><button type="button" id="irSnr">'+(IT.i+1<IT.sira.length?'Sonraki ›':'Sonucu gör')+'</button></div>';
    }
    h+='</div>';
    app.innerHTML=h;

  var KEL=null, KELK={};
  function kelYukle(){ if(KEL) return Promise.resolve(KEL); return fetch('veri/kelimeler.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(L){ KEL=L; L.forEach(function(x){ KELK[x.k]=x; }); return L; }); }
  function ktDurum(){ var d=rd('ml_kt',null); if(!d||!d.k) d={lv:1,bul:false,son:[],ust:[],k:{},n:0,d:0,y:0,kap:'hepsi'}; return d; }

  var BL=null, BT=null;
  var BTERIM=['التشبيه البليغ','الاستعارة التصريحية','الاستعارة المكنية','الكناية','المجاز المرسل','المجاز العقلي','الالتفات','القصر','الاختصاص','التكرار','الإيجاز','الإطناب','التفسير بعد الإبهام','الطباق','المقابلة','الجناس','التقديم','التعريف','التنكير','الاستعارة التبعية','المشاكلة','التتميم','التشبيه التمثيلي','مراعاة النظير','الاعتراض','التعطف'];

  function blCevap(i){

    var r=rd('ml_bl',null)||{n:0,d:0,y:0}; r.b=r.b||{}; r.n++; if(ok){ r.d++; r.b[blAnah(x)]=1; } else r.y++; wr('ml_bl',r);

  /* Karnem: Kur'ân Meali üst başlığı altında Kelime testi, İ'râb testi ve Belâgat testi (ml_oz: {kt, ir, bl}) */
  function mlOzet(k, o){
    try{
      var oz=rd('ml_oz',{}); oz[k]=o; wr('ml_oz',oz);
      var A=['kt','ir','bl'].filter(function(x){ return oz[x]; }).map(function(x){ return oz[x]; }), d=0, y=0, b=0;
      A.forEach(function(a){ d+=a.d||0; y+=a.y||0; b+=a.bitti||0; });
      if(window.gaOzet) gaOzet({bitti:b/A.length, etiket:'', d:d, y:y, kart:oz.kt?oz.kt.kart:0, alt:A, yer:{ad:o.ad, url:o.url}, aktif:true});
    }catch(e){}
  }
  function ktBilinen(d){ var n=0; for(var k in d.k) if(d.k[k].b>=2) n++; return n; }  /* üst üste 2 doğru = biliniyor */
  function oran(a){ if(!a.length) return null; var t=0; a.forEach(function(x){t+=x;}); return t/a.length; }
  function karis(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function harfler(k){ return k.replace(/^(ال|و|ف|ب|ل)/,'').replace(/[اويى]/g,''); }
  function benzerlik(a,b){ var x=harfler(a), y=harfler(b), n=0; for(var i=0;i<x.length;i++) if(y.indexOf(x[i])>=0) n++; return n/Math.max(x.length,y.length,1); }
  /* Kapsam: kelime anlamı yazılmış sûreler kendiliğinden eklenir (30. cüz tek düğme) */
  var KAPSAM=[{k:'hepsi',ad:'Bütün Kur\'an'}].concat(KELSURE.filter(function(n){ return n<78; }).map(function(n){ return {k:''+n, ad:S[n-1][0]}; }), [{k:'c30',ad:'30. cüz'}]);
  function havuz(d){ if(d.kap==='hepsi') return KEL; if(d.kap==='c30') return KEL.filter(function(x){ return x.s.some(function(n){ return n>=78; }); }); return KEL.filter(function(x){ return x.s.indexOf(+d.kap)>=0; }); }

  /* Soru seçimi: seviyedeki ve altındaki kelimeler; yanlışlar ve yeni kelimeler önce; başarı ≥%85 ise beşte bir üst seviyeden serpiştirilir */
  function kelimeSec(d, zorla){
    var H=havuz(d), L=d.lv, kucuk=H.length<40;
    var ac=oran(d.son), ust=false, aday;
    if(zorla) aday=H.filter(function(x){ return x.lv===zorla; });
    else {
      if(!kucuk && d.son.length>=10 && ac>=0.85 && Math.random()<0.2){ aday=H.filter(function(x){ return x.lv===L+1; }); ust=aday.length>0; }
      if(!ust) aday=kucuk?H:H.filter(function(x){ return x.lv<=L; });
    }
    if(!aday.length) aday=H;
    var puan=aday.map(function(x){ var s=d.k[x.k]; var p; if(!s) p=3+(x.lv===L?2:0); else { p=s.b===0?6:(s.b===1?4:(s.b===2?2:0.6)); if(d.n-s.t<3) p=0.05; } return [x,p]; });
    var top=0; puan.forEach(function(q){ top+=q[1]; }); var r=Math.random()*top;
    for(var i=0;i<puan.length;i++){ r-=puan[i][1]; if(r<=0) return {x:puan[i][0], ust:ust}; }
    return {x:puan[0][0], ust:ust};
  }
  /* Soru türü seviyeye göre: 1-2 Arapça→anlam · 3-4 + anlam→Arapça · 5-6 + benzer çeldiriciler · 7+ + âyette boşluk */
  function turSec(lv){ var t=['ar']; if(lv>=3) t.push('tr'); if(lv>=5) t.push('benzer'); if(lv>=7) t.push('ayet'); return t[Math.floor(Math.random()*t.length)]; }
  function celdirici(x, tur){
    var ayni={}; ayni[x.m]=1; ayni[x.k]=1;
    var L=KEL.filter(function(y){ return y.k!==x.k && y.m!==x.m && Math.abs(y.lv-x.lv)<=2; });
    if(tur==='benzer'||tur==='ayet') L=KEL.filter(function(y){ return y.k!==x.k && y.m!==x.m; }).sort(function(a,b){ return benzerlik(x.k,b.k)-benzerlik(x.k,a.k); }).slice(0,12);
    var sec=[]; karis(L.slice()).forEach(function(y){ var anahtar=(tur==='ar'||tur==='benzer')?y.m:y.k; if(sec.length<3 && !ayni[anahtar]){ ayni[anahtar]=1; sec.push(y); } });
    return sec;
  }

  function kapBagla(){ app.querySelectorAll('[data-kap]').forEach(function(b){ b.onclick=function(){ var d=ktDurum(); d.kap=b.dataset.kap; ktKaydet(d); if(KT.mod!=='giris'&&KT.mod!=='bul'){ KT.soru=null; } ktCiz(); }; }); }
  function yeniSoru(){
    var d=ktDurum(), sec, tur;
    if(KT.mod==='bul'){ sec={x:null,ust:false}; var L=KEL.filter(function(x){ return x.lv===KT.bulLv && !(KT.goruldu||{})[x.k]; }); sec.x=L[Math.floor(Math.random()*L.length)]||KEL[0]; KT.goruldu=KT.goruldu||{}; KT.goruldu[sec.x.k]=1; tur='ar'; }
    else { sec=kelimeSec(d); tur=turSec(Math.max(d.lv,sec.x.lv)); if(d.kap!=='hepsi' && tur==='ayet') tur='benzer'; }
    var x=sec.x, cel=celdirici(x, tur);
    var q={x:x, ust:sec.ust, tur:tur, sec:karis([x].concat(cel))};
    KT.cevap=null; KT.soru=q;
    if(tur==='ayet'){
      return veri(x.ex[0]).then(function(o){
        var i=x.ex[1]-1, n=0, hedef=x.ex[2];
        q.s=x.ex[0]; q.a=x.ex[1]; q.meal=o.d[i];
        q.ayetHtml=o.a[i].split(' ').map(function(w){ if(isaret(w)) return esc(w); var h=(n===hedef)?'<u>…</u>':esc(w); n++; return h; }).join(' ');
        ktCiz(); scrollTo(0,0);
      }).catch(function(){ q.tur='tr'; ktCiz(); });
    }
    ktCiz(); scrollTo(0,0);
  }
  function cevapla(i){
    var d=ktDurum(), q=KT.soru, x=q.x, ok=q.sec[i].k===x.k;
    KT.cevap=i;
    if(KT.mod==='bul'){
      KT.bulN++; KT.bulLv=Math.max(1,Math.min(10,KT.bulLv+(ok?1:-1)));
      KT.bulD=(KT.bulD||0)+(ok?1:0);
    } else {
      var s=d.k[x.k]||{b:0,d:0,y:0,t:0}; d.n++;
      if(ok){ s.b=Math.min(5,s.b+1); s.d++; d.d++; } else { s.b=0; s.y++; d.y++; }
      s.t=d.n; d.k[x.k]=s;
      d.son.push(ok?1:0); if(d.son.length>20) d.son.shift();
      var msj='';
      if(q.ust){ d.ust.push(ok?1:0); if(d.ust.length>5) d.ust.shift(); }
      if(d.kap==='hepsi'){
        if(d.lv<10 && d.ust.length>=5 && oran(d.ust)>=0.8 && oran(d.son)>=0.85){ d.lv++; d.ust=[]; d.son=[]; msj='<div class="kt-msj ok">Tebrikler! <b>'+d.lv+'. seviyeye</b> geçtiniz.</div>'; }
        else if(d.lv>1 && d.son.length>=10 && oran(d.son)<0.6){ d.lv--; d.ust=[]; d.son=[]; msj='<div class="kt-msj uy">Biraz pekiştirelim: <b>'+d.lv+'. seviyeye</b> döndünüz. Yanlış yaptığınız kelimeler daha sık gelecek.</div>'; }
      }
      ktKaydet(d); KT.msj=msj;
    }
    ktCiz(KT.msj||''); KT.msj='';
  }
  function bulBitir(){
    var d=ktDurum(); d.lv=Math.max(1,Math.min(10,KT.bulLv-1)); d.bul=true; d.son=[]; d.ust=[]; ktKaydet(d);
    var lv=d.lv, bd=KT.bulD||0; KT={mod:'test'};
    app.innerHTML=ktBaslik(d)+'<div class="card kt-soru" style="text-align:center"><p style="margin:0;color:var(--muted)">Seviyeniz</p><p style="font-size:2.4rem;font-weight:700;color:var(--green);margin:4px 0">'+lv+'</p><p style="margin:0 0 4px">10 sorudan '+bd+' doğru. '+(lv>=7?'Çok iyi gidiyorsunuz.':lv>=4?'Güzel bir başlangıç.':'En sık kelimelerden başlıyoruz.')+'</p><div class="kt-btn"><button type="button" id="ktBas">Teste başla</button></div></div>';
    document.getElementById('ktBas').onclick=function(){ yeniSoru(); }; kapBagla();
  }

  ciz();
})();
</script>
